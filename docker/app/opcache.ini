; Ajustes de rendimiento para desarrollo en Docker sobre Windows (bind mount lento).
; validate_timestamps=0 => OPcache NO revalida ficheros en cada request (gran mejora),
; a cambio hay que reiniciar el contenedor (o `php artisan opcache:clear`) tras cambiar código PHP.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.max_accelerated_files=30000
opcache.interned_strings_buffer=32
opcache.jit=1255
opcache.jit_buffer_size=64M
realpath_cache_size=4096K
realpath_cache_ttl=600
