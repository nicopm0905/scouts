services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: scouts-app:latest
    container_name: scouts_app
    volumes:
      - .:/var/www/html
      - ./docker/app/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # La configuración de BD vive en .env (DB_HOST=db). NO definir DB_* aquí: se
    # convertirían en variables de entorno del SO y anularían el sqlite de phpunit,
    # haciendo que los tests borren la base de datos de desarrollo.
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  # Servidor de desarrollo de Vite (Hot Module Replacement). NO arranca por defecto:
  # solo con `docker compose --profile dev up vite`. Así el `docker compose up` normal
  # sirve los assets ya compilados (public/build) y no crea public/hot.
  vite:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: scouts-app:latest
    container_name: scouts_vite
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: scouts-app:latest
    container_name: scouts_queue
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan queue:work --tries=3 --sleep=3"

  db:
    image: postgres:16
    container_name: scouts_db
    environment:
      POSTGRES_DB: scouts
      POSTGRES_USER: scouts
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouts -d scouts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
